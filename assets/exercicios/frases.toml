# Frases de abertura para o exercício "Continue a frase".
#
# Cada frase é um bloco [[frase]] com:
#   autor    = quem escreveu
#   obra     = o livro ou o conto
#   ano      = ano da publicação original (opcional)
#   tradutor = quem traduziu para o português do Brasil (só em obras traduzidas)
#   texto    = a frase de abertura (uma ou duas linhas, no máximo)
#   fonte    = onde o texto foi conferido (opcional)
#
# Só entram frases curtas, conferidas no texto publicado em português do Brasil.
# "…" no fim marca que a frase original continua.
# Para acrescentar uma frase, copie um bloco e troque os campos.

